# Manually dispatched. Exercises each secret for real without side effects and prints PASS/FAIL
# per secret — presence is not correctness. Values are never printed.

name: verify-secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsx pipeline/src/cli.ts verify
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
