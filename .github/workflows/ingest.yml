# Polls Visayan Electric's public RSS feed, parses changed advisories, commits data/, publishes
# to GitHub Pages, and pushes FCM topic messages. ARCHITECTURE.md §4.
#
# Secrets consumed by name (never printed):
#   FCM_SERVICE_ACCOUNT   Firebase service-account JSON — enables push. Absent → pushes skipped.
# GITHUB_TOKEN is provided by Actions; it files unknown-area issues.

name: ingest

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.run.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Ingest
        id: run
        run: npm run ingest
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Commit data (advisories or heartbeat)
        run: |
          git config user.name "pawer-ingest[bot]"
          git config user.email "pawer-ingest@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            if [ "${{ steps.run.outputs.changed }}" = "true" ]; then
              git commit -m "ingest: advisories updated $(date -u +%FT%TZ)"
            else
              git commit -m "ingest: heartbeat $(date -u +%F)"
            fi
            git push
          fi
      - name: Build site
        if: steps.run.outputs.changed == 'true'
        run: npx tsx pipeline/src/cli.ts publish
      - uses: actions/configure-pages@v5
        if: steps.run.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.run.outputs.changed == 'true'
        with:
          path: dist

  deploy:
    needs: ingest
    if: needs.ingest.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
