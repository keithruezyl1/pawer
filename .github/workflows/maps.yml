# Composites one locator image per barangay from MapTiler RASTER tiles (free plan) — BRD D-26.
#   review:  every candidate centroid → workflow artifact "map-review" (index.html contact sheet)
#            so a person can check each pin before flipping verified:true (rule C3)
#   publish: verified centroids only → assets/maps/, committed, served by Pages
# Runs on centroid/renderer changes and on demand — never on the ingest schedule.
# Secret consumed by name: MAPTILER_KEY (restricted to the "PAWER-maps" User-Agent).

name: maps

on:
  push:
    branches: [main]
    paths:
      - "packages/registry/centroids.json"
      - "pipeline/src/maps/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maps
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Render review set (all candidates)
        run: npx tsx pipeline/src/maps/cli.ts --review
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: map-review
          path: review/maps
          retention-days: 14

      - name: Render published set (verified only)
        run: npx tsx pipeline/src/maps/cli.ts
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
      - name: Commit published maps
        run: |
          git config user.name "pawer-maps[bot]"
          git config user.email "pawer-maps@users.noreply.github.com"
          git add assets/maps
          if git diff --cached --quiet; then echo "no published map changes"; else git commit -m "maps: render $(date -u +%F)" && git push; fi
