# Republishes the static site when something other than an ingest changes what is served:
# the registry, the release manifest, rendered map images, or the publisher itself.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "packages/registry/barangays.json"
      - "packages/registry/lgus.json"
      - "release/version.json"
      - "assets/maps/**"
      - "pipeline/src/cli.ts"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsx pipeline/src/cli.ts publish
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
